# Minimal single-instance setup for the agent BFF.
#
# 1. Copy .env.example to .env and fill in your secrets.
# 2. docker compose up
#
# Point your frontend at: http://localhost:3450

services:
  agent-bff:
    image: ghcr.io/forestadmin/agent-bff:latest
    restart: unless-stopped
    # Forward the whole .env into the container (see .env.example for the full
    # list of knobs). Unset optional vars fall back to the image's built-in
    # defaults — no whitelist to keep in sync.
    env_file:
      - .env
    # Lets AGENT_URL reach host services via host.docker.internal on Linux too
    # (resolves natively on Docker Desktop, no-op there).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Host side and container side are separate knobs: BFF_HOST_PORT remaps the
    # published port without touching what the BFF listens on. HTTP_PORT=0 (an
    # ephemeral port the app picks at boot) is a valid app value but cannot be
    # published — there is no target port to write here — so leave it set.
    ports:
      - "${BFF_HOST_PORT:-3450}:${HTTP_PORT:-3450}"
    # Longer than the BFF's own 10s grace period for in-flight requests, so the
    # process gets to finish its shutdown instead of being SIGKILLed mid-way.
    stop_grace_period: 15s
    # Healthcheck is inherited from the image's HEALTHCHECK (see Dockerfile).
