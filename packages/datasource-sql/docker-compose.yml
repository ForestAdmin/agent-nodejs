version: '3.1'
x-healthcheck-timing: &healthcheck-timing
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 180s
  start_interval: 2s
services:
  postgres9:
    image: postgres:9
    container_name: forest_datasource_sql_test_postgres9
    ports:
      - '5439:5432'
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'test']
      <<: *healthcheck-timing

  postgres16:
    image: postgres:16
    container_name: forest_datasource_sql_test_postgres16
    ports:
      - '5446:5432'
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'test']
      <<: *healthcheck-timing

  mysql5:
    image: mysql:5
    container_name: forest_datasource_sql_test_mysql5
    platform: linux/amd64
    ports:
      - '3305:3306'
    environment:
      - MYSQL_ROOT_PASSWORD=password
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-ppassword', '--silent']
      <<: *healthcheck-timing

  mysql8:
    image: mysql:8
    container_name: forest_datasource_sql_test_mysql8
    ports:
      - '3308:3306'
    environment:
      - MYSQL_ROOT_PASSWORD=password
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-ppassword', '--silent']
      <<: *healthcheck-timing

  mssql2017:
    image: mcr.microsoft.com/mssql/server:2017-latest
    container_name: forest_datasource_sql_test_mssql2017
    platform: linux/amd64
    ports:
      - '1417:1433'
    environment:
      - MSSQL_SA_PASSWORD=yourStrong(!)Password
      - ACCEPT_EULA=Y

  mssql2022:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: forest_datasource_sql_test_mssql2022
    platform: linux/amd64
    ports:
      - '1422:1433'
    environment:
      - MSSQL_SA_PASSWORD=yourStrong(!)Password
      - ACCEPT_EULA=Y
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      <<: *healthcheck-timing

  mariadb10:
    image: mariadb:10
    container_name: forest_datasource_sql_test_mariadb10
    platform: linux/amd64
    ports:
      - '3810:3306'
    environment:
      - MARIADB_ROOT_PASSWORD=password
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      <<: *healthcheck-timing

  mariadb11:
    image: mariadb:11.2
    container_name: forest_datasource_sql_test_mariadb11
    ports:
      - '3811:3306'
    environment:
      - MARIADB_ROOT_PASSWORD=password
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      <<: *healthcheck-timing

  socks-proxy:
    image: serjs/go-socks5-proxy
    container_name: socks_proxy
    ports:
      - '1083:1080'
    environment:
      - PROXY_USER=username
      - PROXY_PASSWORD=password

  ssh-server:
    image: lscr.io/linuxserver/openssh-server:9.7_p1-r4-ls173
    container_name: ssh_server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PUBLIC_KEY_FILE=/config/id_rsa.pub # path to the public key file inside the container
      - USER_NAME=forest
      - DOCKER_MODS=linuxserver/mods:openssh-server-ssh-tunnel # enable AllowTcpForwarding here
      - LOG_STDOUT=true
    volumes:
      - ./test/ssh-config:/config
    ports:
      - '2222:2222'
    healthcheck:
      test:
        - CMD-SHELL
        - grep -q '^AllowTcpForwarding yes' /etc/ssh/sshd_config && nc -z localhost 2222
      <<: *healthcheck-timing
