name: Publish agent-bff Docker image

on:
  # Releases publish via workflow_dispatch from build.yml's `release` job, not a
  # tag-push trigger — the release commit's `[skip ci]` would suppress it.
  pull_request:
    # Validate on any change to what the image actually contains. The 4 dependency
    # packages ship as `dist` inside it, so their `src` is image code and belongs
    # here — a change there can break startup with nothing in this repo to catch it.
    # Their manifests matter for a second reason: a dep bump in one of them drifts
    # the image's dedicated lockfile (see packages/agent-bff/docker/).
    paths:
      - 'packages/agent-bff/**'
      - 'packages/agent-client/src/**'
      - 'packages/agent-client/package.json'
      - 'packages/agent-toolkit/src/**'
      - 'packages/agent-toolkit/package.json'
      - 'packages/datasource-toolkit/src/**'
      - 'packages/datasource-toolkit/package.json'
      - 'packages/forestadmin-client/src/**'
      - 'packages/forestadmin-client/package.json'
      # The builder runs `yarn install --frozen-lockfile` from the repo root, so a
      # lockfile-only change can alter the build (build.yml installs without
      # --frozen-lockfile and wouldn't catch an inconsistency).
      - 'yarn.lock'
      - '.github/workflows/docker-publish-bff.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. 1.20.2)'
        required: true

# Every `uses:` below is pinned to a commit, with its release in the trailing comment. A tag is a
# pointer the action's owner can move — tj-actions/changed-files was rewritten across all of its
# tags in March 2025 — and the jobs here hold `packages: write` and a registry login, so a moved
# tag would run under credentials that can publish to GHCR. A commit cannot be moved.
#
# The cost is that a pin does not receive the action's fixes by itself: bump these deliberately, the
# way the Dockerfile's base digest is bumped.

# The floor, for every job. `packages: write` is granted per job, to the two that push, and never
# to `validate`: that one runs on pull_request, so it builds and executes code the PR controls —
# its Dockerfile, its docker/*.js, its smoke test. A token that can write to GHCR has no business
# being reachable from there, and validate needs none: it builds with `push: false` and never logs
# in to the registry.
permissions:
  contents: read

concurrency:
  # A publish is keyed by the version alone, deliberately without the ref: two dispatches
  # for the same version from different branches would otherwise run side by side, both
  # find the version tag free, and both publish — the immutability check in the merge job
  # only holds if same-version publishes are serialised. They queue instead of cancelling,
  # so the second one runs that check against what the first actually published.
  #
  # Different versions still publish concurrently and can finish out of order; the merge
  # job re-decides latest-stable against the tags as they are then, so the finishing order
  # cannot regress the mutable tags.
  #
  # PRs keep the opposite behaviour, grouped by ref and cancelling: a superseded validation
  # of an older push is waste, not a release.
  group: docker-publish-bff-${{ github.event_name == 'workflow_dispatch' && format('publish-{0}', github.event.inputs.version) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On PRs: build the image (no push) to catch Dockerfile breakage before release.
  validate:
    name: Validate Dockerfile build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Check @forestadmin dependency closure
        run: node packages/agent-bff/docker/check-deps-closure.js

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: packages/agent-bff/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: agent-bff:pr
          build-args: APT_EPOCH=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=bff-amd64

      # The build only proves the image compiles. Run it to catch entrypoint
      # breakage, a missing module (e.g. an un-copied @forestadmin package), a
      # missing Redoc bundle, or a startup crash — none of which a build-only step
      # would surface.
      - name: Smoke test (CLI + module graph + boot)
        run: sh packages/agent-bff/docker/smoke-test.sh agent-bff:pr

      # Gate by ORIGIN, not severity. OS packages can only be fixed here, so they
      # BLOCK; the BFF's npm deps are already shipped via the package, so blocking
      # the image would just desync GHCR from npm — those are report-only (fixed at
      # the source).
      #
      # The blocking scan keeps `ignore-unfixed`, because a finding with no fixed
      # version is not actionable here: the apt upgrade above already pulls every
      # patch Debian has published. On the current base that is the whole of the
      # HIGH/CRITICAL OS surface — 0 fixed, 56 unfixed — so blocking on unfixed
      # would block every build, forever, in exchange for an ignore file that grows
      # to 56 entries. The report below keeps them visible instead.
      - name: Scan OS packages (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agent-bff:pr
          vuln-type: os
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan OS packages, unfixed included (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agent-bff:pr
          vuln-type: os
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '0'
      - name: Scan libraries (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agent-bff:pr
          vuln-type: library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: json
          output: trivy-libs.json
      - name: Report npm deps
        run: node packages/agent-bff/docker/scan-gate.js trivy-libs.json

  extract-version:
    name: Extract version
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.version.outputs.full }}
      minor: ${{ steps.version.outputs.minor }}
      major: ${{ steps.version.outputs.major }}
    # No checkout: splitting a version string needs no repository. Whether this is
    # the latest stable version is decided once, in the merge job, against the tags
    # as they are at that moment (see there).
    steps:
      - name: Parse version from input
        id: version
        # The dispatch input reaches the shell through `env`, never interpolated into
        # the script: `${{ }}` is substituted as raw text before bash sees it, so a
        # crafted version would run as commands with this job's packages:write token.
        # It is then validated as a semver before anything is done with it — the
        # `ref:` the build job checks out is built from the same value.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version input: expected MAJOR.MINOR.PATCH[-prerelease]."
            exit 1
          fi
          echo "full=$VERSION" >> $GITHUB_OUTPUT
          echo "minor=${VERSION%.*}" >> $GITHUB_OUTPUT
          echo "major=${VERSION%%.*}" >> $GITHUB_OUTPUT

  build:
    name: Build (${{ matrix.arch }})
    if: github.event_name != 'pull_request'
    needs: extract-version
    runs-on: ${{ matrix.runner }}
    # Pushes by digest, so it is one of the two jobs that needs the registry.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Build from the requested version's tag, not the default branch. Taken from
          # extract-version rather than the raw input, so only a validated semver ever
          # reaches a ref.
          ref: ${{ format('@forestadmin/agent-bff@{0}', needs.extract-version.outputs.full) }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      # Also run here, not only in the PR job: a dependency change can reach main
      # through a path the `paths:` filter above does not cover, and would then hit
      # the release build unchecked. The failure mode is a container that dies on
      # `Cannot find module`, which no other step in this job would catch.
      - name: Check @forestadmin dependency closure
        run: node packages/agent-bff/docker/check-deps-closure.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and LOAD locally first (no push) so we can smoke-test and scan the
      # exact image before it reaches the registry. Nothing is published until
      # both gates pass — otherwise a vulnerable/broken image would be pullable
      # by digest even when the gate "fails".
      - name: Build (load for gating)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: packages/agent-bff/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: agent-bff:${{ matrix.arch }}
          build-args: APT_EPOCH=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=bff-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=bff-${{ matrix.arch }}

      - name: Smoke test (CLI + module graph + boot)
        run: sh packages/agent-bff/docker/smoke-test.sh agent-bff:${{ matrix.arch }}

      # Gate by origin (see the validate job): OS packages block; the BFF's npm
      # deps are report-only, and unfixed OS findings are reported, not blocked.
      - name: Scan OS packages (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agent-bff:${{ matrix.arch }}
          vuln-type: os
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan OS packages, unfixed included (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agent-bff:${{ matrix.arch }}
          vuln-type: os
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '0'
      - name: Scan libraries (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agent-bff:${{ matrix.arch }}
          vuln-type: library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: json
          output: trivy-libs.json
      - name: Report npm deps
        run: node packages/agent-bff/docker/scan-gate.js trivy-libs.json

      # All gates passed (smoke + OS scan). Publish by digest.
      #
      # This is a SECOND build, not a push of the image the steps above scanned: the
      # docker driver cannot load a push-by-digest result, and push-by-digest is what
      # the multi-arch manifest below is assembled from. It is the same context and
      # the same Dockerfile, and the gating build wrote every layer to the cache this
      # one reads, so buildx reuses them — but that is a cache hit, not a checked
      # identity. What the gate really buys is that a build which fails smoke or scan
      # never reaches the registry at all.
      #
      # The first push CREATES the GHCR package, private. Nothing here can change that:
      # visibility is a package setting, and `packages: write` on GITHUB_TOKEN grants the
      # push, not the admin. Flip it to public once, by hand, in the package settings —
      # the README tells users to log in until that is done.
      - name: Push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: packages/agent-bff/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/forestadmin/agent-bff,push-by-digest=true,name-canonical=true,push=true
          sbom: true
          build-args: APT_EPOCH=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=bff-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-bff-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    if: github.event_name != 'pull_request'
    needs: [extract-version, build]
    runs-on: ubuntu-latest
    # Assembles and pushes the multi-arch manifest.
    permissions:
      contents: read
      packages: write
    outputs:
      # Decided here rather than in extract-version, against the tags as they stand
      # when the manifest is written. notify-server reads it to gate the prod deploy.
      is_latest: ${{ steps.recheck.outputs.is_latest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Tags only — this job builds nothing, it re-reads the release history below.
          fetch-depth: 0

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-bff-*
          merge-multiple: true
          path: /tmp/digests

      # The mutable tags (:latest, :major, :minor) move only for the highest STABLE
      # version of this package. Deciding it HERE rather than at the start of the run
      # is what makes it safe: two dispatches for different versions run concurrently
      # (their concurrency groups differ by version), and an older one finishing last
      # would otherwise move :latest back onto a stale image.
      #
      # Comparing against stable-only tags covers the other two cases for free — a
      # prerelease never matches the pattern, and neither does a rebuild of an older
      # version. We look at this package's tags specifically: the repo-wide GitHub
      # "latest release" belongs to whichever monorepo package shipped last.
      - name: Decide latest-stable against current tags
        id: recheck
        env:
          FULL: ${{ needs.extract-version.outputs.full }}
        run: |
          PREFIX="@forestadmin/agent-bff@"
          LATEST_STABLE=$(git tag --list "${PREFIX}*" \
            | sed "s|^${PREFIX}||" \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n1)
          if [ "$FULL" = "$LATEST_STABLE" ]; then
            echo "is_latest=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::${FULL} is no longer the latest stable version (${LATEST_STABLE}); leaving the mutable tags alone."
            echo "is_latest=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/forestadmin/agent-bff
          FULL: ${{ needs.extract-version.outputs.full }}
          MINOR: ${{ needs.extract-version.outputs.minor }}
          MAJOR: ${{ needs.extract-version.outputs.major }}
          IS_LATEST: ${{ steps.recheck.outputs.is_latest }}
        run: |
          # :$FULL is advertised as immutable, so a re-dispatch of a version that
          # already shipped must not repoint it at the images this run just built.
          # Compare what the tag resolves to against those digests — the attestation
          # manifests the SBOM adds carry no architecture, so they are not part of the
          # comparison. Identical means this is a replay (recovering a merge job that
          # died, or moving the mutable tags): let it through, imagetools rewrites the
          # same list. Different means the version was rebuilt, and the answer is a new
          # version, not a silently different 1.20.2.
          if EXISTING=$(docker buildx imagetools inspect "$IMAGE:$FULL" --raw 2>/tmp/inspect.err); then
            HAVE=$(printf '%s' "$EXISTING" \
              | jq -r '.manifests[]? | select(.platform.architecture != "unknown") | .digest' | sort)
            WANT=$(printf 'sha256:%s\n' * | sort)
            if [ "$HAVE" != "$WANT" ]; then
              echo "::error::$IMAGE:$FULL already exists and points to other images."
              echo "published: $(echo $HAVE)" >&2
              echo "this run:  $(echo $WANT)" >&2
              exit 1
            fi
            echo "::notice::$IMAGE:$FULL already points to these images; re-tagging is a no-op."
          # Only an explicit not-found means the tag is free. Every other failure — a network
          # blip, an expired token, a registry 5xx — resolves nothing, and reading it as "absent"
          # would hand this run a tag it never checked. buildx says `<ref>: not found` for a tag
          # that is not there, and `failed to authorize: ...` for a repository it cannot read.
          elif grep -qiE 'not found|manifest unknown|name unknown' /tmp/inspect.err; then
            echo "::notice::$IMAGE:$FULL does not exist yet."
          else
            cat /tmp/inspect.err >&2
            echo "::error::Could not resolve $IMAGE:$FULL. Refusing to publish over a tag whose contents are unknown."
            exit 1
          fi

          # Always publish the immutable full-version tag. The mutable tags
          # (minor, major, latest) only move when this is the latest stable
          # version, so neither a prerelease nor a rebuild of an older version
          # ever overwrites the current stable :latest / :1 images.
          TAGS="-t $IMAGE:$FULL"
          if [ "$IS_LATEST" = "true" ]; then
            TAGS="$TAGS -t $IMAGE:$MINOR -t $IMAGE:$MAJOR -t $IMAGE:latest"
          fi
          docker buildx imagetools create $TAGS \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect manifest
        run: docker buildx imagetools inspect ghcr.io/forestadmin/agent-bff:${{ needs.extract-version.outputs.full }}

  # Notify forestadmin-server so it auto-deploys the new image to production.
  # Only for the latest STABLE version — never a prerelease, and never a rebuild of
  # an older version, neither of which may regress production. That decision is the
  # merge job's: it is made against the release tags as they stand when the manifest
  # is written, which is the same reading that decided whether :latest moved.
  # GITHUB_TOKEN can't dispatch into another repo, so this uses a dedicated token
  # (fine-grained PAT or GitHub App) with Contents:write on forestadmin-server.
  notify-server:
    name: Trigger forestadmin-server prod deploy
    if: github.event_name != 'pull_request' && needs.merge.outputs.is_latest == 'true'
    needs: [extract-version, merge]
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch
        env:
          DISPATCH_TOKEN: ${{ secrets.SERVER_DEPLOY_DISPATCH_TOKEN }}
          VERSION: ${{ needs.extract-version.outputs.full }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::SERVER_DEPLOY_DISPATCH_TOKEN is not set — cannot trigger the forestadmin-server prod deploy."
            exit 1
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ForestAdmin/forestadmin-server/dispatches \
            -d "{\"event_type\":\"agent-bff-published\",\"client_payload\":{\"version\":\"${VERSION}\"}}"
          echo "Dispatched agent-bff-published (version ${VERSION}) to forestadmin-server."
