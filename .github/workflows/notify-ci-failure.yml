name: Notify CI Failure on Main

on:
  workflow_run:
    workflows: ['Lint, Build, Test and Doc', 'LLM Integration Tests']
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  check-and-notify:
    uses: forestadmin/.github/.github/workflows/notify-ci-failure.yml@main
    with:
      slack_channel_id: GAZF5Q5RV
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
